function fmtMoney(n) {
  if (n === 0) return "—";
  return `$${Number(n).toLocaleString(undefined, { minimumFractionDigits: n % 1 !== 0 ? 2 : 0, maximumFractionDigits: 2 })}`;
}

function fmtMoneyPlain(n) {
  const num = Number(n) || 0;
  return `$${num.toLocaleString(undefined, { minimumFractionDigits: num % 1 !== 0 ? 2 : 0, maximumFractionDigits: 2 })}`;
}

function fmtMoneyWhole(n) {
  const num = Number(n) || 0;
  return `$${Math.round(num).toLocaleString()}`;
}

function getPeriodInfo(periodicity, date = new Date(), resetMonth, resetDay) {
  const y = date.getFullYear();
  const m = date.getMonth();
  let key, start, end, label;
  if (periodicity === "monthly") {
    key = `${y}-${String(m + 1).padStart(2, "0")}`;
    start = new Date(y, m, 1);
    end = new Date(y, m + 1, 0);
    label = start.toLocaleDateString(undefined, { month: "long" });
  } else if (periodicity === "quarterly") {
    const q = Math.floor(m / 3);
    key = `${y}-Q${q + 1}`;
    start = new Date(y, q * 3, 1);
    end = new Date(y, q * 3 + 3, 0);
    label = `Q${q + 1} ${y}`;
  } else if (periodicity === "semiannual") {
    const h = m < 6 ? 1 : 2;
    key = `${y}-H${h}`;
    start = new Date(y, h === 1 ? 0 : 6, 1);
    end = new Date(y, h === 1 ? 6 : 12, 0);
    label = h === 1 ? `Jan–Jun ${y}` : `Jul–Dec ${y}`;
  } else if (resetMonth && resetDay) {
    // Anniversary-based annual credit: runs from the most recent reset date up to (not
    // including) the next one, rather than the calendar year.
    const am = resetMonth - 1;
    const thisYearReset = new Date(y, am, resetDay);
    const startYear = date < thisYearReset ? y - 1 : y;
    start = new Date(startYear, am, resetDay);
    end = new Date(startYear + 1, am, resetDay - 1);
    key = `${startYear}-${String(resetMonth).padStart(2, "0")}-${String(resetDay).padStart(2, "0")}`;
    label = `${start.toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${end.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`;
  } else {
    key = `${y}`;
    start = new Date(y, 0, 1);
    end = new Date(y, 11, 31);
    label = `${y}`;
  }
  const total = end - start;
  const elapsed = date - start;
  const daysLeft = Math.max(0, Math.ceil((end - date) / (1000 * 60 * 60 * 24)));
  return { key, start, end, label, fracElapsed: Math.min(1, Math.max(0, elapsed / total)), daysLeft };
}

// Turns a stored period key (e.g. "2026-03", "2026-Q1", "2026-H1", "2026", or the
// anniversary-style "2026-03-15") back into a readable label and a sortable date, for
// browsing past periods in the History view.
function parsePeriodKey(periodicity, key) {
  const year = Number(key.slice(0, 4));
  if (periodicity === "monthly") {
    const m = Number(key.slice(5, 7));
    return { label: new Date(year, m - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" }), sortDate: new Date(year, m - 1, 1) };
  }
  if (periodicity === "quarterly") {
    const q = Number(key.slice(6, 7));
    return { label: `Q${q} ${year}`, sortDate: new Date(year, (q - 1) * 3, 1) };
  }
  if (periodicity === "semiannual") {
    const h = Number(key.slice(6, 7));
    return { label: h === 1 ? `Jan–Jun ${year}` : `Jul–Dec ${year}`, sortDate: new Date(year, h === 1 ? 0 : 6, 1) };
  }
  if (key.length > 4) {
    // Anniversary-based annual credit: "YYYY-MM-DD" marks the start of that credit's cycle.
    const parts = key.split("-");
    const am = Number(parts[1]) - 1;
    const ad = Number(parts[2]);
    const start = new Date(year, am, ad);
    const end = new Date(year + 1, am, ad - 1);
    return {
      label: `${start.toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${end.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}`,
      sortDate: start,
    };
  }
  return { label: `${year}`, sortDate: new Date(year, 0, 1) };
}

// Redemption + completion are derived from the benefit's current definition, not a frozen
// snapshot, so editing a credit's value later doesn't leave stale numbers in past periods.
function redeemedValue(benefit, u) {
  const mode = benefit.trackingMode || "single";
  const cap = Number(benefit.value) || 0;
  if (!u) return 0;
  if (mode === "offer") return Number(u.amount) || 0; // no cap — whatever's been logged is the value
  if (mode === "cumulative") return Math.min(Number(u.amount) || 0, cap);
  if (mode === "counter") return (Number(u.count) || 0) * cap;
  return u.used || u.done ? cap : 0;
}

function isBenefitDone(benefit, u) {
  const mode = benefit.trackingMode || "single";
  if (!u) return false;
  if (mode === "offer") return false; // open-ended — never "complete"
  if (mode === "cumulative") {
    const cap = Number(benefit.value) || 0;
    return cap > 0 && (Number(u.amount) || 0) >= cap;
  }
  if (mode === "counter") {
    return Number(benefit.targetCount) > 0 && (Number(u.count) || 0) >= Number(benefit.targetCount);
  }
  return !!(u.used || u.done);
}

function BenefitsLedger({ instanceRef, ledgerCode, userLabel, onSignOut, onSwitchLedger }) {

  const [usage, setUsage] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [error, setError] = useState(null);
  const [selectedCardIds, setSelectedCardIds] = useState(new Set()); // empty = all cards
  const isAllSelected = selectedCardIds.size === 0;
  const [selectedCategoryIds, setSelectedCategoryIds] = useState(new Set()); // empty = all categories
  const isAllCategoriesSelected = selectedCategoryIds.size === 0;
  const [cardModal, setCardModal] = useState(null); // null | 'new' | card
  const [benefitModal, setBenefitModal] = useState(null); // null | {cardId} | benefit
  const [showTemplates, setShowTemplates] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null); // {type, id, name}
  const [searchQuery, setSearchQuery] = useState("");
  const [sortMode, setSortMode] = useState("custom"); // urgency | value | name | custom — default is manual drag order, grouped by periodicity
  const [showFees, setShowFees] = useState(false);
  const [showCapturedDetail, setShowCapturedDetail] = useState(false);
  const [expandedCategories, setExpandedCategories] = useState(new Set());
  const toggleCategoryDetail = (id) => {
    setExpandedCategories((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };
  const [view, setView] = useState("ledger"); // "ledger" | "history"
  const [historyYear, setHistoryYear] = useState(new Date().getFullYear());
  const [viewDate, setViewDate] = useState(null); // null = live/today; otherwise editing that past period
  const [ledgerName, setLedgerName] = useState("Willis Family Card Benefits Ledger");
  const [showSettings, setShowSettings] = useState(false);

  // Live shared data: subscribes to this instance's Firestore document and mirrors it
  // into local state; every write below re-sends the full {cards, benefits, usage}
  // snapshot, so anyone else with this ledger's code sees updates immediately.
  useEffect(() => {
    const unsub = instanceRef.onSnapshot(
      (snap) => {
        const data = snap.data() || { cards: [], benefits: [], usage: {} };
        setCards(data.cards || []);
        setBenefits(data.benefits || []);
        setUsage(data.usage || {});
        setLedgerName(data.ledgerName || "Willis Family Card Benefits Ledger");
        setLoaded(true);
      },
      () => {
        setError("Couldn't load — check your connection.");
        setLoaded(true);
      }
    );
    return unsub;
  }, [instanceRef]);

  const persist = useCallback(
    (next) => {
      instanceRef
        .set(next)
        .then(() => setError(null))
        .catch(() => setError("Couldn't save — your changes may not persist."));
    },
    [instanceRef]
  );

  const commit = useCallback(
    (updates) => {
      const next = {
        cards: updates.cards ?? cards,
        benefits: updates.benefits ?? benefits,
        usage: updates.usage ?? usage,
        ledgerName: updates.ledgerName ?? ledgerName,
      };
      if (updates.cards) setCards(updates.cards);
      if (updates.benefits) setBenefits(updates.benefits);
      if (updates.usage) setUsage(updates.usage);
      if (updates.ledgerName !== undefined) setLedgerName(updates.ledgerName);
      persist(next);
    },
    [cards, benefits, usage, ledgerName, persist]
  );

  const fileInputRef = useRef(null);
  const [pendingImport, setPendingImport] = useState(null);
  const [importError, setImportError] = useState(null);

  const handleExport = () => {
    const payload = { cards, benefits, usage, ledgerName, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `benefits-ledger-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleImportFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || !Array.isArray(parsed.cards) || !Array.isArray(parsed.benefits) || typeof parsed.usage !== "object") {
          setImportError("That doesn't look like a ledger backup file.");
          return;
        }
        setImportError(null);
        setPendingImport({ cards: parsed.cards, benefits: parsed.benefits, usage: parsed.usage || {}, ledgerName: parsed.ledgerName || ledgerName });
      } catch (err) {
        setImportError("Couldn't read that file — make sure it's a backup exported from this ledger.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const confirmImport = () => {
    if (!pendingImport) return;
    commit(pendingImport);
    setPendingImport(null);
  };

  const toggleSingleUsage = (benefitId, periodKey) => {
    const usageKey = `${benefitId}:${periodKey}`;
    const wasUsed = !!(usage[usageKey]?.used || usage[usageKey]?.done);
    const nextUsage = { ...usage };
    if (wasUsed) delete nextUsage[usageKey];
    else nextUsage[usageKey] = { used: true, updatedAt: new Date().toISOString() };
    commit({ usage: nextUsage });
  };

  const setUsageAmount = (benefitId, periodKey, amount) => {
    const usageKey = `${benefitId}:${periodKey}`;
    const nextUsage = { ...usage };
    if (amount <= 0) delete nextUsage[usageKey];
    else nextUsage[usageKey] = { amount, updatedAt: new Date().toISOString() };
    commit({ usage: nextUsage });
  };

  const setUsageCount = (benefitId, periodKey, count) => {
    const usageKey = `${benefitId}:${periodKey}`;
    const nextUsage = { ...usage };
    if (count <= 0) delete nextUsage[usageKey];
    else nextUsage[usageKey] = { count, updatedAt: new Date().toISOString() };
    commit({ usage: nextUsage });
  };

  // Cash-back offers accumulate: each entry adds to whatever's already logged for that
  // month, rather than replacing it — since a card might have several separate deals
  // redeemed within the same period.
  const addOfferAmount = (benefitId, periodKey, delta) => {
    const usageKey = `${benefitId}:${periodKey}`;
    const current = Number(usage[usageKey]?.amount) || 0;
    const next = current + (Number(delta) || 0);
    const nextUsage = { ...usage };
    if (next <= 0) delete nextUsage[usageKey];
    else nextUsage[usageKey] = { amount: next, updatedAt: new Date().toISOString() };
    commit({ usage: nextUsage });
  };

  const saveCard = (card) => {
    const exists = cards.some((c) => c.id === card.id);
    const nextCards = exists ? cards.map((c) => (c.id === card.id ? card : c)) : [...cards, card];
    commit({ cards: nextCards });
    setCardModal(null);
  };

  const deleteCard = (cardId) => {
    const nextCards = cards.filter((c) => c.id !== cardId);
    const removedBenefitIds = benefits.filter((b) => b.cardId === cardId).map((b) => b.id);
    const nextBenefits = benefits.filter((b) => b.cardId !== cardId);
    const nextUsage = { ...usage };
    Object.keys(nextUsage).forEach((k) => {
      if (removedBenefitIds.some((id) => k.startsWith(id + ":"))) delete nextUsage[k];
    });
    commit({ cards: nextCards, benefits: nextBenefits, usage: nextUsage });
    setSelectedCardIds((prev) => {
      if (!prev.has(cardId)) return prev;
      const next = new Set(prev);
      next.delete(cardId);
      return next;
    });
    setConfirmDelete(null);
  };

  const saveBenefit = (benefit) => {
    const exists = benefits.some((b) => b.id === benefit.id);
    const nextBenefits = exists ? benefits.map((b) => (b.id === benefit.id ? benefit : b)) : [...benefits, benefit];
    commit({ benefits: nextBenefits });
    setBenefitModal(null);
  };

  const deleteBenefit = (benefitId) => {
    const nextBenefits = benefits.filter((b) => b.id !== benefitId);
    const nextUsage = { ...usage };
    Object.keys(nextUsage).forEach((k) => {
      if (k.startsWith(benefitId + ":")) delete nextUsage[k];
    });
    commit({ benefits: nextBenefits, usage: nextUsage });
    setConfirmDelete(null);
  };

  // Drag-and-drop reordering (Sort: Custom) works directly on the order benefits are
  // stored in — dropping one credit onto another moves it to sit right before that one.
  const reorderBenefit = (draggedId, targetId) => {
    if (draggedId === targetId) return;
    const draggedIndex = benefits.findIndex((b) => b.id === draggedId);
    if (draggedIndex === -1) return;
    const next = [...benefits];
    const [item] = next.splice(draggedIndex, 1);
    const insertAt = next.findIndex((b) => b.id === targetId);
    if (insertAt === -1) {
      next.push(item);
    } else {
      next.splice(insertAt, 0, item);
    }
    commit({ benefits: next });
  };

  const addTemplate = (template) => {
    const cardId = uid();
    const colorIndex = cards.length % PALETTE.length;
    const newCard = { id: cardId, name: template.name, issuer: template.issuer, annualFee: template.annualFee, color: PALETTE[colorIndex] };
    const newBenefits = template.benefits.map((b) => ({ id: uid(), cardId, ...b }));
    commit({ cards: [...cards, newCard], benefits: [...benefits, ...newBenefits] });
    setShowTemplates(false);
    setSelectedCardIds(new Set([cardId]));
  };

  const visibleBenefits = useMemo(() => {
    let list = isAllSelected ? benefits : benefits.filter((b) => selectedCardIds.has(b.cardId));
    if (!isAllCategoriesSelected) list = list.filter((b) => selectedCategoryIds.has(b.category));
    const q = searchQuery.trim().toLowerCase();
    if (q) {
      list = list.filter((b) => {
        const card = cards.find((c) => c.id === b.cardId);
        return (
          b.name.toLowerCase().includes(q) ||
          (b.vendor || "").toLowerCase().includes(q) ||
          (b.notes || "").toLowerCase().includes(q) ||
          (card?.name || "").toLowerCase().includes(q)
        );
      });
    }
    return list;
  }, [benefits, selectedCardIds, isAllSelected, selectedCategoryIds, isAllCategoriesSelected, searchQuery, cards]);

  const uncategorizedBenefits = useMemo(() => benefits.filter((b) => !b.category), [benefits]);

  const saveCategorization = (choices) => {
    const nextBenefits = benefits.map((b) => (choices[b.id] ? { ...b, category: choices[b.id] } : b));
    commit({ benefits: nextBenefits });
  };

  const grouped = useMemo(() => {
    const g = {};
    PERIODICITY.forEach((p) => (g[p.id] = []));
    visibleBenefits.forEach((b) => g[b.periodicity]?.push(b));
    const refDate = viewDate || new Date();
    const isDoneForPeriod = (b) => {
      const info = getPeriodInfo(b.periodicity, refDate, b.resetMonth, b.resetDay);
      return isBenefitDone(b, usage[`${b.id}:${info.key}`]);
    };
    // Whatever's already checked off for the period being viewed sinks to the bottom of
    // its section, regardless of sort mode — this is a tracker of what's left first.
    Object.keys(g).forEach((pid) => {
      if (sortMode === "custom") {
        const notDone = g[pid].filter((b) => !isDoneForPeriod(b));
        const done = g[pid].filter((b) => isDoneForPeriod(b));
        g[pid] = [...notDone, ...done]; // preserves manual order within each partition
      } else {
        g[pid].sort((a, b) => {
          const doneA = isDoneForPeriod(a);
          const doneB = isDoneForPeriod(b);
          if (doneA !== doneB) return doneA ? 1 : -1;
          if (sortMode === "value") return (Number(b.value) || 0) - (Number(a.value) || 0);
          return a.name.localeCompare(b.name); // default: alphabetical within each periodicity group
        });
      }
    });
    return g;
  }, [visibleBenefits, sortMode, usage, viewDate]);

  // Urgency sort ignores periodicity groups entirely — it's one ranked list across every
  // credit, ordered by whichever deadline is soonest, so a quarterly credit due in 3 days
  // outranks a monthly one due in 20. Cash-back offers have no deadline, so they always
  // sort to the very end regardless of days left.
  const flatUrgencySorted = useMemo(() => {
    if (sortMode !== "urgency") return [];
    const refDate = viewDate || new Date();
    const rank = (b, u) => {
      if ((b.trackingMode || "single") === "offer") return 2;
      return isBenefitDone(b, u) ? 1 : 0;
    };
    return [...visibleBenefits].sort((a, b) => {
      const infoA = getPeriodInfo(a.periodicity, refDate, a.resetMonth, a.resetDay);
      const infoB = getPeriodInfo(b.periodicity, refDate, b.resetMonth, b.resetDay);
      const rankA = rank(a, usage[`${a.id}:${infoA.key}`]);
      const rankB = rank(b, usage[`${b.id}:${infoB.key}`]);
      if (rankA !== rankB) return rankA - rankB;
      return infoA.daysLeft - infoB.daysLeft;
    });
  }, [visibleBenefits, sortMode, usage, viewDate]);

  const hasAnyVisible = useMemo(() => {
    if (sortMode === "urgency") return flatUrgencySorted.length > 0;
    return Object.values(grouped).some((list) => list.length > 0);
  }, [grouped, flatUrgencySorted, sortMode]);

  const stats = useMemo(() => {
    const now = new Date();
    const year = now.getFullYear();
    const cardScopedBenefits = isAllSelected ? benefits : benefits.filter((b) => selectedCardIds.has(b.cardId));
    const scopedBenefits = isAllCategoriesSelected ? cardScopedBenefits : cardScopedBenefits.filter((b) => selectedCategoryIds.has(b.category));
    const benefitsById = Object.fromEntries(scopedBenefits.map((b) => [b.id, b]));
    const cardScopedBenefitsById = Object.fromEntries(cardScopedBenefits.map((b) => [b.id, b]));
    let capturedThisYear = 0;
    let remainingPotential = 0;
    const capturedByBenefitMap = {};
    // Category totals ignore the category filter itself (always all 5), scoped only by
    // card selection, so they're a side-by-side comparison regardless of which chip is active.
    const capturedByCategory = Object.fromEntries(CATEGORIES.map((c) => [c.id, 0]));

    Object.entries(usage).forEach(([k, u]) => {
      const sep = k.indexOf(":");
      const benefitId = k.slice(0, sep);
      const periodKey = k.slice(sep + 1);
      const b = benefitsById[benefitId];
      const cardScopedB = cardScopedBenefitsById[benefitId];
      if (cardScopedB && periodKey.slice(0, 4) === String(year)) {
        const catVal = redeemedValue(cardScopedB, u);
        const cat = cardScopedB.category;
        if (capturedByCategory[cat] !== undefined) capturedByCategory[cat] += catVal;
      }
      if (!b) return;
      if (periodKey.slice(0, 4) === String(year)) {
        const val = redeemedValue(b, u);
        capturedThisYear += val;
        capturedByBenefitMap[benefitId] = (capturedByBenefitMap[benefitId] || 0) + val;
      }
    });

    const capturedByBenefit = Object.entries(capturedByBenefitMap)
      .map(([benefitId, total]) => ({ benefit: benefitsById[benefitId], total }))
      .filter((e) => e.benefit && e.total > 0)
      .sort((a, b) => b.total - a.total);

    // "Total possible remaining credit" projects forward through the rest of the calendar
    // year: whatever's left in the current period, plus every full period still to come
    // before December 31, assuming each one gets maxed out. Only modes with a real dollar
    // cap (single, cumulative) project forward — counters and open-ended cash-back offers
    // don't have a cap that repeats predictably, so they only count what's on the table
    // right now.
    scopedBenefits.forEach((b) => {
      const mode = b.trackingMode || "single";
      const info = getPeriodInfo(b.periodicity, now, b.resetMonth, b.resetDay);
      const u = usage[`${b.id}:${info.key}`];
      const cap = Number(b.value) || 0;
      const redeemed = redeemedValue(b, u);
      const currentRemaining = isBenefitDone(b, u) ? 0 : Math.max(0, cap - redeemed);

      let futurePeriods = 0;
      if (mode === "single" || mode === "cumulative") {
        if (b.periodicity === "monthly") futurePeriods = 11 - now.getMonth();
        else if (b.periodicity === "quarterly") futurePeriods = 3 - Math.floor(now.getMonth() / 3);
        else if (b.periodicity === "semiannual") futurePeriods = now.getMonth() < 6 ? 1 : 0;
        // annual credits only have one period a year, so no future periods to add
      }

      const remainingForYear = currentRemaining + futurePeriods * cap;
      remainingPotential += remainingForYear;
    });

    const scopedCards = isAllSelected ? cards : cards.filter((c) => selectedCardIds.has(c.id));
    const totalAnnualFees = scopedCards.reduce((s, c) => s + (Number(c.annualFee) || 0), 0);
    return { capturedThisYear, remainingPotential, capturedByBenefit, capturedByCategory, totalAnnualFees };
  }, [usage, benefits, cards, selectedCardIds, isAllSelected, selectedCategoryIds, isAllCategoriesSelected]);

  const historyYears = useMemo(() => {
    const current = new Date().getFullYear();
    const years = [];
    for (let y = 2026; y <= current; y++) years.push(y);
    return years;
  }, []);

  // Months selectable for backfilling past periods: January 2026 through the current month.
  const periodOptions = useMemo(() => {
    const now = new Date();
    const opts = [];
    let y = 2026;
    let m = 0;
    while (y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())) {
      const d = new Date(y, m, 1);
      opts.push({ key: `${y}-${String(m + 1).padStart(2, "0")}`, date: d, label: d.toLocaleDateString(undefined, { month: "long", year: "numeric" }) });
      m += 1;
      if (m > 11) { m = 0; y += 1; }
    }
    return opts.reverse(); // most recent first
  }, []);

  const historyEntries = useMemo(() => {
    const benefitsById = Object.fromEntries(benefits.map((b) => [b.id, b]));
    const cardsById = Object.fromEntries(cards.map((c) => [c.id, c]));
    const entries = [];
    Object.entries(usage).forEach(([k, u]) => {
      const sep = k.indexOf(":");
      const benefitId = k.slice(0, sep);
      const periodKey = k.slice(sep + 1);
      if (Number(periodKey.slice(0, 4)) !== historyYear) return;
      const b = benefitsById[benefitId];
      if (!b) return;
      if (!isAllSelected && !selectedCardIds.has(b.cardId)) return;
      if (!isAllCategoriesSelected && !selectedCategoryIds.has(b.category)) return;
      const { label, sortDate } = parsePeriodKey(b.periodicity, periodKey);
      entries.push({
        key: k,
        periodLabel: label,
        sortDate,
        benefit: b,
        card: cardsById[b.cardId],
        redeemed: redeemedValue(b, u),
      });
    });
    entries.sort((a, b) => b.sortDate - a.sortDate || a.benefit.name.localeCompare(b.benefit.name));
    return entries;
  }, [usage, benefits, cards, historyYear, selectedCardIds, isAllSelected, selectedCategoryIds, isAllCategoriesSelected]);

  const historyTotal = useMemo(() => historyEntries.reduce((s, e) => s + e.redeemed, 0), [historyEntries]);

  if (!loaded) {
    return (
      <div style={{ ...S.root, display: "flex", alignItems: "center", justifyContent: "center", minHeight: 300 }}>
        <span style={{ color: S.colors.muted, fontFamily: S.fonts.mono, fontSize: 13 }}>Loading ledger…</span>
      </div>
    );
  }

  const selectedCards = cards.filter((c) => selectedCardIds.has(c.id));
  const cardScopeLabel = isAllSelected
    ? "across all cards"
    : selectedCards.length === 1
    ? `on ${selectedCards[0].name}`
    : `across ${selectedCards.length} selected cards`;
  const cardScopeSuffix = isAllSelected
    ? ""
    : selectedCards.length === 1
    ? ` · ${selectedCards[0].name}`
    : ` · ${selectedCards.length} cards selected`;

  return (
    <div style={S.root}>
      <style>{CSS_TEXT}</style>

      <div style={S.iconStrip}>
        <div style={S.iconTile}><CatFaceIcon /></div>
        <div style={S.iconTile}><CatCardIcon /></div>
        <div style={S.iconTile}><CatSittingIcon /></div>
      </div>

      <div style={S.header}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
          <h1 style={S.h1}>{ledgerName}</h1>
          <span style={{ fontFamily: S.fonts.mono, fontSize: 12, color: S.colors.gold, letterSpacing: "0.04em" }}>PURRKFECTION</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
          {error && <div style={S.errorBanner}>{error}</div>}
          {importError && <div style={S.errorBanner}>{importError}</div>}
          <input
            ref={fileInputRef}
            type="file"
            accept="application/json"
            style={{ display: "none" }}
            onChange={handleImportFile}
          />
          <button
            type="button"
            className="lg-chip"
            style={{ ...S.chip, ...(view === "history" ? S.chipActive : {}) }}
            onClick={() => setView((v) => (v === "history" ? "ledger" : "history"))}
          >
            {view === "history" ? "Back to ledger" : "History"}
          </button>
          <button
            type="button"
            className="lg-chip"
            style={{ ...S.chip, ...(showFees ? S.chipActive : {}) }}
            onClick={() => setShowFees((v) => !v)}
          >
            {showFees ? "Hide annual fees" : "Compare to annual fees"}
          </button>
          <button
            type="button"
            className="lg-backupbtn"
            style={{ ...S.backupBtn, width: 32, height: 32, background: S.colors.surface, border: `1px solid ${S.colors.border}`, borderRadius: 8 }}
            onClick={() => setShowSettings(true)}
            aria-label="Settings"
            title="Settings"
          >
            <Settings size={16} />
          </button>
        </div>
      </div>

      <div style={S.heroBox}>
        <div style={S.heroLabel}>
          Captured this year{cardScopeSuffix}
        </div>
        <div style={S.heroTopRow}>
          <div style={S.heroValue}>{fmtMoney(stats.capturedThisYear)}</div>
          {stats.capturedByBenefit.length > 0 && (
            <button
              type="button"
              className="lg-detailtoggle"
              style={S.detailToggleBtn}
              onClick={() => setShowCapturedDetail((v) => !v)}
              aria-label={showCapturedDetail ? "Hide breakdown by credit" : "Show breakdown by credit"}
              title={showCapturedDetail ? "Hide breakdown by credit" : "Show breakdown by credit"}
            >
              <ChevronDown size={18} style={{ transform: showCapturedDetail ? "rotate(180deg)" : "none", transition: "transform 0.15s ease" }} />
            </button>
          )}
        </div>
        <div style={S.heroSub}>
          {showFees
            ? stats.capturedThisYear - stats.totalAnnualFees >= 0
              ? `+${fmtMoneyPlain(stats.capturedThisYear - stats.totalAnnualFees)} net vs fees`
              : `${fmtMoneyPlain(stats.totalAnnualFees - stats.capturedThisYear)} short of fees`
            : `${new Date().getFullYear()}`}
        </div>
        {showCapturedDetail && (
          <div style={S.capturedDetailList}>
            {CATEGORIES.map((c) => {
              const entries = stats.capturedByBenefit.filter((e) => e.benefit.category === c.id);
              const isOpen = expandedCategories.has(c.id);
              return (
                <div key={c.id}>
                  <div
                    className="lg-historyrow"
                    style={{ ...S.capturedDetailRow, cursor: "pointer" }}
                    onClick={() => toggleCategoryDetail(c.id)}
                  >
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <ChevronDown
                        size={14}
                        style={{ color: S.colors.muted, transform: isOpen ? "rotate(180deg)" : "none", transition: "transform 0.15s ease", flexShrink: 0 }}
                      />
                      <span style={S.rowName}>{c.label}</span>
                    </div>
                    <div style={S.historyValue}>{fmtMoneyWhole(stats.capturedByCategory[c.id])}</div>
                  </div>
                  {isOpen && (
                    entries.length === 0 ? (
                      <div style={{ ...S.capturedDetailRow, paddingLeft: 22, color: S.colors.muted, fontSize: 13 }}>
                        Nothing captured in this category yet.
                      </div>
                    ) : (
                      entries.map(({ benefit, total }) => {
                        const card = cards.find((cc) => cc.id === benefit.cardId);
                        return (
                          <div key={benefit.id} style={{ ...S.capturedDetailRow, paddingLeft: 22 }}>
                            <div style={S.historyMain}>
                              <span style={S.rowName}>{benefit.name}</span>
                              {benefit.vendor && <span style={S.vendorTag}>{benefit.vendor}</span>}
                              {isAllSelected && card && (
                                <span style={S.cardBadge}>
                                  <span style={{ width: 9, height: 9, borderRadius: "50%", background: card.color, display: "inline-block" }} />
                                  {card.name}
                                </span>
                              )}
                            </div>
                            <div style={S.historyValue}>{fmtMoneyWhole(total)}</div>
                          </div>
                        );
                      })
                    )
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {showFees && (
        <div style={S.statRow}>
          <Stat label="Annual fees" value={fmtMoney(stats.totalAnnualFees)} sub={cardScopeLabel} />
          <Stat
            label="Total possible remaining credit"
            value={fmtMoney(stats.remainingPotential)}
            sub={cardScopeLabel}
            accent={S.colors.amber}
          />
        </div>
      )}

      <div style={S.walletRow}>
        <button
          type="button"
          className="lg-chip"
          style={{ ...S.chip, ...(isAllSelected ? S.chipActive : {}) }}
          onClick={() => setSelectedCardIds(new Set())}
          title="Show every card"
        >
          All cards
        </button>
        {cards.map((c) => (
          <div
            key={c.id}
            className="lg-cardtile"
            style={{
              ...S.cardTile,
              background: c.color,
              boxShadow: "0 1px 0 rgba(255,255,255,0.06) inset",
              opacity: isAllSelected || selectedCardIds.has(c.id) ? 1 : 0.55,
            }}
            onClick={(e) => {
              if (e.metaKey || e.ctrlKey) {
                setSelectedCardIds((prev) => {
                  const next = new Set(prev);
                  if (next.has(c.id)) next.delete(c.id);
                  else next.add(c.id);
                  return next;
                });
              } else {
                setSelectedCardIds(new Set([c.id]));
              }
            }}
            title="Click to select. Ctrl/Cmd-click to select more than one."
          >
            <div style={S.cardTileTop}>
              <span style={S.cardTileName}>{c.name}</span>
              <div className="lg-cardactions">
                <Pencil size={13} style={S.iconBtn} onClick={(e) => { e.stopPropagation(); setCardModal(c); }} />
                <Trash2 size={13} style={S.iconBtn} onClick={(e) => { e.stopPropagation(); setConfirmDelete({ type: "card", id: c.id, name: c.name }); }} />
              </div>
            </div>
            <div style={S.cardTileIssuer}>{c.issuer}</div>
            <div style={S.cardTileFee}>{fmtMoney(c.annualFee)} / yr</div>
          </div>
        ))}
        <button type="button" className="lg-chip" style={S.addCardChip} onClick={() => setCardModal("new")}>
          <Plus size={14} /> Add card
        </button>
      </div>

      {benefits.length > 0 && (
        <div style={S.categoryRow}>
          <button
            type="button"
            className="lg-chip"
            style={{ ...S.chip, ...(isAllCategoriesSelected ? S.chipActive : {}) }}
            onClick={() => setSelectedCategoryIds(new Set())}
            title="Show every category"
          >
            All categories
          </button>
          {CATEGORIES.map((c) => (
            <button
              key={c.id}
              type="button"
              className="lg-chip"
              style={{ ...S.chip, ...(selectedCategoryIds.has(c.id) ? S.chipActive : {}) }}
              onClick={(e) => {
                if (e.metaKey || e.ctrlKey) {
                  setSelectedCategoryIds((prev) => {
                    const next = new Set(prev);
                    if (next.has(c.id)) next.delete(c.id);
                    else next.add(c.id);
                    return next;
                  });
                } else {
                  setSelectedCategoryIds(new Set([c.id]));
                }
              }}
              title="Click to select. Ctrl/Cmd-click to select more than one."
            >
              {c.label}
            </button>
          ))}
        </div>
      )}

      {cards.length === 0 ? (
        <EmptyState onAdd={() => setCardModal("new")} onTemplates={() => setShowTemplates(true)} />
      ) : view === "history" ? (
        <div style={S.ledger}>
          <div style={S.toolbar}>
            {historyYears.map((y) => (
              <button
                key={y}
                type="button"
                className="lg-chip"
                style={{ ...S.chip, ...(historyYear === y ? S.chipActive : {}) }}
                onClick={() => setHistoryYear(y)}
              >
                {y}
              </button>
            ))}
          </div>

          <div style={S.historyTotalRow}>
            <span style={S.historyTotalLabel}>Captured in {historyYear}</span>
            <span style={S.historyTotalValue}>{fmtMoney(historyTotal)}</span>
          </div>

          {historyEntries.length === 0 ? (
            <div style={{ color: S.colors.muted, fontSize: 13, padding: "16px 6px" }}>
              Nothing logged for {historyYear} yet{!isAllSelected ? " for the selected card(s)" : ""}.
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column" }}>
              {historyEntries.map((e) => (
                <div
                  key={e.key}
                  className="lg-historyrow"
                  style={S.historyRow}
                  onClick={() => { setViewDate(e.sortDate); setView("ledger"); }}
                  title="Click to edit this period"
                >
                  <div style={S.historyPeriod}>{e.periodLabel}</div>
                  <div style={S.historyMain}>
                    <span style={S.rowName}>{e.benefit.name}</span>
                    {e.benefit.vendor && <span style={S.vendorTag}>{e.benefit.vendor}</span>}
                    {e.benefit.category && (
                      <span style={S.categoryTag}>{CATEGORIES.find((c) => c.id === e.benefit.category)?.label || e.benefit.category}</span>
                    )}
                    {isAllSelected && e.card && (
                      <span style={S.cardBadge}>
                        <span style={{ width: 9, height: 9, borderRadius: "50%", background: e.card.color, display: "inline-block" }} />
                        {e.card.name}
                      </span>
                    )}
                  </div>
                  <div style={S.historyValue}>{fmtMoney(e.redeemed)}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      ) : (
        <div style={S.ledger}>
          <div style={S.toolbar}>
            <div style={S.searchBox}>
              <Search size={14} color={S.colors.muted} />
              <input
                style={S.searchInput}
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search benefits, vendors, notes…"
              />
            </div>
            <select style={S.sortSelect} value={sortMode} onChange={(e) => setSortMode(e.target.value)}>
              <option value="name">Sort: Name (by period)</option>
              <option value="value">Sort: Highest value (by period)</option>
              <option value="urgency">Sort: Urgency (all credits)</option>
              <option value="custom">Sort: Custom (drag to reorder)</option>
            </select>
            <select
              style={{ ...S.sortSelect, color: viewDate ? S.colors.gold : S.colors.muted, borderColor: viewDate ? S.colors.gold : S.colors.border }}
              value={viewDate ? periodOptions.find((o) => o.date.getFullYear() === viewDate.getFullYear() && o.date.getMonth() === viewDate.getMonth())?.key || "live" : "live"}
              onChange={(e) => setViewDate(e.target.value === "live" ? null : periodOptions.find((o) => o.key === e.target.value)?.date || null)}
            >
              <option value="live">Today</option>
              {periodOptions.map((o) => (
                <option key={o.key} value={o.key}>{o.label}</option>
              ))}
            </select>
          </div>

          {viewDate && (
            <div style={S.historicalBanner}>
              <span>
                Editing <strong>{viewDate.toLocaleDateString(undefined, { month: "long", year: "numeric" })}</strong> — check off or log whatever you used that period.
              </span>
              <button type="button" className="lg-btn-ghost" style={S.btnGhost} onClick={() => setViewDate(null)}>Back to today</button>
            </div>
          )}

          {!hasAnyVisible && (
            <div style={{ color: S.colors.muted, fontSize: 13, padding: "16px 6px" }}>
              {searchQuery ? `No benefits match "${searchQuery}".` : "No benefits yet."}
            </div>
          )}

          {sortMode === "urgency" ? (
            flatUrgencySorted.length > 0 && (
              <div style={S.periodSection}>
                {flatUrgencySorted.map((b) => (
                  <BenefitRow
                    key={b.id}
                    benefit={b}
                    card={cards.find((c) => c.id === b.cardId)}
                    showCard={isAllSelected}
                    usage={usage}
                    periodDate={viewDate}
                    isHistorical={!!viewDate}
                    onToggleSingle={toggleSingleUsage}
                    onSetAmount={setUsageAmount}
                    onSetCount={setUsageCount}
                    onAddOfferAmount={addOfferAmount}
                    onEdit={() => setBenefitModal(b)}
                    onDelete={() => setConfirmDelete({ type: "benefit", id: b.id, name: b.name })}
                  />
                ))}
              </div>
            )
          ) : (
            PERIODICITY.map((p) => {
              const list = grouped[p.id];
              if (!list || list.length === 0) return null;
              return (
                <div key={p.id} style={S.periodSection}>
                  <div style={S.periodHeading}>
                    <span>{p.label}</span>
                    <span style={S.periodRule} />
                  </div>
                  {list.map((b) => (
                    <BenefitRow
                      key={b.id}
                      benefit={b}
                      card={cards.find((c) => c.id === b.cardId)}
                      showCard={isAllSelected}
                      usage={usage}
                      periodDate={viewDate}
                      isHistorical={!!viewDate}
                      reorderable={sortMode === "custom"}
                      onReorder={reorderBenefit}
                      onToggleSingle={toggleSingleUsage}
                      onSetAmount={setUsageAmount}
                      onSetCount={setUsageCount}
                      onAddOfferAmount={addOfferAmount}
                      onEdit={() => setBenefitModal(b)}
                      onDelete={() => setConfirmDelete({ type: "benefit", id: b.id, name: b.name })}
                    />
                  ))}
                </div>
              );
            })
          )}
          <button
            type="button"
            className="lg-addbenefit"
            style={S.addBenefitBtn}
            onClick={() => setBenefitModal({ cardId: isAllSelected ? cards[0]?.id : selectedCards[0]?.id })}
          >
            <Plus size={14} /> Add benefit
          </button>
        </div>
      )}

      {cardModal && (
        <CardModal
          card={cardModal === "new" ? null : cardModal}
          nextColor={PALETTE[cards.length % PALETTE.length]}
          onSave={saveCard}
          onClose={() => setCardModal(null)}
          onUseTemplate={cardModal === "new" ? () => { setCardModal(null); setShowTemplates(true); } : undefined}
        />
      )}

      {benefitModal && (
        <BenefitModal
          benefit={benefitModal.id ? benefitModal : null}
          cards={cards}
          defaultCardId={benefitModal.cardId}
          onSave={saveBenefit}
          onClose={() => setBenefitModal(null)}
        />
      )}

      {showTemplates && (
        <Modal onClose={() => setShowTemplates(false)} title="Start from a template">
          <div style={{ color: S.colors.muted, fontSize: 13, marginBottom: 16, lineHeight: 1.5 }}>
            Common premium-card benefits to get you started, matched to each issuer's current posted terms. Terms and credits change often — check your card's current benefits guide before relying on these amounts.
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {TEMPLATES.map((t) => (
              <button type="button" key={t.name} className="lg-template" style={S.templateRow} onClick={() => addTemplate(t)}>
                <div>
                  <div style={{ fontFamily: S.fonts.serif, fontSize: 16, color: S.colors.text }}>{t.name}</div>
                  <div style={{ fontSize: 12, color: S.colors.muted, marginTop: 2 }}>{t.issuer} · {fmtMoney(t.annualFee)}/yr · {t.benefits.length} benefits</div>
                </div>
                <Plus size={16} color={S.colors.gold} />
              </button>
            ))}
          </div>
        </Modal>
      )}

      {confirmDelete && (
        <Modal onClose={() => setConfirmDelete(null)} title={`Delete ${confirmDelete.type === "card" ? "card" : "benefit"}?`}>
          <p style={{ color: S.colors.muted, fontSize: 14, marginBottom: 20 }}>
            {confirmDelete.type === "card"
              ? `This removes "${confirmDelete.name}" and all of its benefits and usage history. This can't be undone.`
              : `This removes "${confirmDelete.name}" and its usage history. This can't be undone.`}
          </p>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <button type="button" className="lg-btn-ghost" style={S.btnGhost} onClick={() => setConfirmDelete(null)}>Cancel</button>
            <button
              type="button"
              className="lg-btn-danger"
              style={S.btnDanger}
              onClick={() => (confirmDelete.type === "card" ? deleteCard(confirmDelete.id) : deleteBenefit(confirmDelete.id))}
            >
              Delete
            </button>
          </div>
        </Modal>
      )}

      {pendingImport && (
        <Modal onClose={() => setPendingImport(null)} title="Import backup?">
          <p style={{ color: S.colors.muted, fontSize: 14, marginBottom: 20, lineHeight: 1.5 }}>
            This replaces the current ledger — {cards.length} card{cards.length === 1 ? "" : "s"} and {benefits.length} benefit{benefits.length === 1 ? "" : "s"} —
            with {pendingImport.cards.length} card{pendingImport.cards.length === 1 ? "" : "s"} and {pendingImport.benefits.length} benefit{pendingImport.benefits.length === 1 ? "" : "s"} from the file.
            Since this ledger is shared, it replaces it for everyone with the code. This can't be undone.
          </p>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <button type="button" className="lg-btn-ghost" style={S.btnGhost} onClick={() => setPendingImport(null)}>Cancel</button>
            <button type="button" className="lg-btn-danger" style={S.btnDanger} onClick={confirmImport}>Import</button>
          </div>
        </Modal>
      )}

      {showSettings && (
        <SettingsModal
          ledgerName={ledgerName}
          onRenameSave={(name) => commit({ ledgerName: name })}
          ledgerCode={ledgerCode}
          userLabel={userLabel}
          onExport={handleExport}
          onImportClick={() => fileInputRef.current?.click()}
          onSwitchLedger={onSwitchLedger}
          onSignOut={onSignOut}
          onClose={() => setShowSettings(false)}
        />
      )}

      {uncategorizedBenefits.length > 0 && (
        <CategorizeBackfillModal benefits={uncategorizedBenefits} cards={cards} onSave={saveCategorization} />
      )}
    </div>
  );
}

function BenefitRow({ benefit, card, showCard, usage, periodDate, isHistorical, reorderable, onReorder, onToggleSingle, onSetAmount, onSetCount, onAddOfferAmount, onEdit, onDelete }) {
  const mode = benefit.trackingMode || "single";
  const info = getPeriodInfo(benefit.periodicity, periodDate || new Date(), benefit.resetMonth, benefit.resetDay);
  const usageEntry = usage[`${benefit.id}:${info.key}`];
  const cap = Number(benefit.value) || 0;
  const amountUsed = mode === "cumulative" ? Math.min(Number(usageEntry?.amount) || 0, cap) : 0;
  const offerTotal = mode === "offer" ? Number(usageEntry?.amount) || 0 : 0;
  const count = mode === "counter" ? Number(usageEntry?.count) || 0 : 0;
  const done = isBenefitDone(benefit, usageEntry);
  const urgent = !done && !isHistorical && info.daysLeft <= 5 && mode !== "counter" && mode !== "offer";

  const [logging, setLogging] = useState(false);
  const [draft, setDraft] = useState("");
  const [dragging, setDragging] = useState(false);

  // Pointer Events (not HTML5 drag-and-drop, which iOS Safari has never
  // supported for touch) so drag-to-reorder works on the phone this app
  // actually runs on. Initiated from the grip handle only, so a tap
  // anywhere else in the row (checkbox, edit, delete) is unaffected.
  const handleGripDown = (e) => {
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId);
    setDragging(true);
  };
  const handleGripUp = (e) => {
    e.currentTarget.releasePointerCapture(e.pointerId);
    setDragging(false);
    const target = document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-benefit-row]");
    const targetId = target?.getAttribute("data-benefit-row");
    if (targetId) onReorder(benefit.id, targetId);
  };
  const handleGripCancel = () => setDragging(false);

  const openLog = () => {
    setDraft(mode === "offer" ? "" : String(amountUsed || ""));
    setLogging(true);
  };
  const saveLog = () => {
    const n = Number(draft) || 0;
    if (mode === "offer") {
      onAddOfferAmount(benefit.id, info.key, n);
    } else {
      onSetAmount(benefit.id, info.key, Math.max(0, Math.min(n, cap)));
    }
    setLogging(false);
  };

  return (
    <div
      className="lg-row"
      data-benefit-row={benefit.id}
      style={{ ...S.row, opacity: dragging ? 0.4 : 1 }}
    >
      {reorderable && (
        <span
          style={{ ...S.dragHandle, touchAction: "none" }}
          aria-hidden="true"
          onPointerDown={handleGripDown}
          onPointerUp={handleGripUp}
          onPointerCancel={handleGripCancel}
        >
          <GripVertical size={14} />
        </span>
      )}
      {mode === "single" && (
        <button
          type="button"
          className="lg-check"
          style={{ ...S.checkbox, background: done ? S.colors.sage : "transparent", borderColor: done ? S.colors.sage : S.colors.border }}
          onClick={() => onToggleSingle(benefit.id, info.key)}
          aria-label={done ? "Mark unused" : "Mark used"}
        >
          {done && <Check size={13} color="#0F1216" strokeWidth={3} />}
        </button>
      )}

      {mode === "counter" && (
        <div style={S.counterControl}>
          <button type="button" className="lg-counterbtn" style={S.counterBtn} onClick={() => onSetCount(benefit.id, info.key, Math.max(0, count - 1))} aria-label="Decrease">
            <Minus size={12} />
          </button>
          <span style={S.counterVal}>{count}</span>
          <button type="button" className="lg-counterbtn" style={S.counterBtn} onClick={() => onSetCount(benefit.id, info.key, count + 1)} aria-label="Increase">
            <Plus size={12} />
          </button>
        </div>
      )}

      {mode === "cumulative" && !logging && (
        <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
          <button
            type="button"
            className="lg-check"
            style={{
              ...S.checkbox,
              borderRadius: 8,
              overflow: "hidden",
              position: "relative",
              background: done ? S.colors.sage : "transparent",
              borderColor: done ? S.colors.sage : S.colors.border,
            }}
            onClick={() => onSetAmount(benefit.id, info.key, done ? 0 : cap)}
            aria-label={done ? "Mark unused" : "Mark fully used"}
          >
            {!done && (
              <span
                style={{
                  position: "absolute", left: 0, bottom: 0, width: "100%",
                  height: `${cap > 0 ? Math.min(100, (amountUsed / cap) * 100) : 0}%`,
                  background: S.colors.amber, opacity: 0.4,
                }}
              />
            )}
            <span style={{ position: "relative", display: "flex" }}>
              {done && <Check size={13} color="#0F1216" strokeWidth={3} />}
            </span>
          </button>
          <button type="button" className="lg-logpartial" style={S.logPartialBtn} onClick={openLog} aria-label="Log a partial amount">
            <Pencil size={11} />
          </button>
        </div>
      )}

      {mode === "offer" && !logging && (
        <button type="button" className="lg-offeradd" style={S.offerAddBtn} onClick={openLog} aria-label="Add a cash-back amount">
          <Plus size={12} /> Add
        </button>
      )}

      {(mode === "cumulative" || mode === "offer") && logging && (
        <div style={S.logPopover} onClick={(e) => e.stopPropagation()}>
          <input
            autoFocus
            type="number"
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
            style={S.logInput}
            placeholder={mode === "offer" ? "$ earned" : undefined}
            onKeyDown={(e) => {
              if (e.key === "Enter") saveLog();
              if (e.key === "Escape") setLogging(false);
            }}
          />
          <button type="button" style={S.logBtn} onClick={saveLog} aria-label="Save"><Check size={12} /></button>
          <button type="button" style={S.logBtnGhost} onClick={() => setLogging(false)} aria-label="Cancel"><X size={12} /></button>
        </div>
      )}

      <div style={S.rowMain}>
        <div style={S.rowTop}>
          <span style={{ ...S.rowName, textDecoration: done ? "line-through" : "none", color: done ? S.colors.muted : S.colors.text }}>
            {benefit.name}
          </span>
          {benefit.vendor && <span style={S.vendorTag}>{benefit.vendor}</span>}
          {benefit.category && (
            <span style={S.categoryTag}>{CATEGORIES.find((c) => c.id === benefit.category)?.label || benefit.category}</span>
          )}
          {mode === "offer" && <span style={S.offerTag}>Cash back</span>}
          {showCard && card && (
            <span style={S.cardBadge}>
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: card.color, display: "inline-block" }} />
              {card.name}
            </span>
          )}
        </div>
        {benefit.notes && <div style={S.rowNotes}>{benefit.notes}</div>}
        {mode !== "offer" && (
          <div style={S.progressTrack}>
            <div
              style={{
                ...S.progressFill,
                width: `${mode === "cumulative" ? (cap > 0 ? Math.min(100, (amountUsed / cap) * 100) : 0) : info.fracElapsed * 100}%`,
                background: done ? S.colors.sage : mode === "cumulative" ? S.colors.amber : urgent ? S.colors.rose : S.colors.border2,
              }}
            />
          </div>
        )}
      </div>
      <div style={S.rowRight}>
        <div style={S.rowValue}>
          {mode === "cumulative"
            ? `${fmtMoneyPlain(amountUsed)} / ${fmtMoney(cap)}`
            : mode === "counter"
            ? benefit.targetCount
              ? `${count} / ${benefit.targetCount}`
              : `${count}×`
            : mode === "offer"
            ? fmtMoneyPlain(offerTotal)
            : fmtMoney(cap)}
        </div>
        <div style={{ ...S.rowDays, color: urgent ? S.colors.roseText : S.colors.muted }}>
          {mode === "counter" || mode === "offer" || done || isHistorical ? info.label : info.daysLeft === 0 ? "last day" : `${info.daysLeft}d left`}
        </div>
      </div>
      <div className="lg-rowactions" style={S.rowActions}>
        <Pencil size={13} style={S.iconBtn} onClick={onEdit} />
        <Trash2 size={13} style={S.iconBtn} onClick={onDelete} />
      </div>
    </div>
  );
}

function SettingsModal({ ledgerName, onRenameSave, ledgerCode, userLabel, onExport, onImportClick, onSwitchLedger, onSignOut, onClose }) {
  const [nameDraft, setNameDraft] = useState(ledgerName);
  const [copyFeedback, setCopyFeedback] = useState(false);

  const saveName = () => {
    const trimmed = nameDraft.trim();
    if (trimmed && trimmed !== ledgerName) onRenameSave(trimmed);
  };

  const copyCode = () => {
    navigator.clipboard?.writeText(ledgerCode).then(() => {
      setCopyFeedback(true);
      setTimeout(() => setCopyFeedback(false), 1500);
    });
  };

  return (
    <Modal onClose={onClose} title="Settings">
      <Field label="Ledger name">
        <div style={{ display: "flex", gap: 8 }}>
          <input
            style={S.input}
            value={nameDraft}
            onChange={(e) => setNameDraft(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") saveName(); }}
            placeholder="e.g. Smith Family Card Ledger"
          />
          <button type="button" className="lg-btn-ghost" style={S.btnGhost} onClick={saveName} disabled={!nameDraft.trim() || nameDraft.trim() === ledgerName}>
            Save
          </button>
        </div>
      </Field>

      <Field label="Ledger code">
        <div style={S.codeMenuCode} onClick={copyCode} title="Click to copy">
          {ledgerCode} {copyFeedback ? "✓ copied" : ""}
        </div>
        <div style={S.codeMenuHint}>Share this code with anyone else who should see this ledger — they'll sign in with Google and enter it.</div>
      </Field>

      <Field label="Backup">
        <div style={{ display: "flex", gap: 10 }}>
          <button type="button" className="lg-btn-ghost" style={{ ...S.btnGhost, flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }} onClick={onExport}>
            <Download size={13} /> Export
          </button>
          <button type="button" className="lg-btn-ghost" style={{ ...S.btnGhost, flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }} onClick={onImportClick}>
            <Upload size={13} /> Import

        </div>
      </Field>

      <Field label="Account">
        <div style={{ fontSize: 12, color: S.colors.muted, marginBottom: 10, fontFamily: S.fonts.mono }}>{userLabel}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <button type="button" className="lg-btn-ghost" style={S.btnGhost} onClick={onSwitchLedger}>Use a different ledger</button>
          <button type="button" className="lg-btn-ghost" style={S.btnGhost} onClick={onSignOut}>Sign out</button>
        </div>
      </Field>
    </Modal>
  );
}

function CardModal({ card, nextColor, onSave, onClose, onUseTemplate }) {
  const [name, setName] = useState(card?.name || "");
  const [issuer, setIssuer] = useState(card?.issuer || "");
  const [annualFee, setAnnualFee] = useState(card?.annualFee ?? "");
  const [color, setColor] = useState(card?.color || nextColor);
  const [nameError, setNameError] = useState(false);

  const handleSave = () => {
    if (name.trim().length === 0) {
      setNameError(true);
      return;
    }
    onSave({ id: card?.id || uid(), name: name.trim(), issuer: issuer.trim(), annualFee: Number(annualFee) || 0, color });
  };

  return (
    <Modal onClose={onClose} title={card ? "Edit card" : "Add card"}>
      {onUseTemplate && (
        <button
          type="button"
          style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: "none", color: S.colors.gold, fontSize: 13, cursor: "pointer", padding: 0, marginBottom: 18 }}
          onClick={onUseTemplate}
        >
          <Sparkles size={13} /> Or start from a template instead
        </button>
      )}
      <Field label="Card name">
        <input
          style={{ ...S.input, borderColor: nameError ? S.colors.rose : S.colors.border }}
          value={name}
          onChange={(e) => { setName(e.target.value); if (nameError) setNameError(false); }}
          placeholder="e.g. Amex Platinum"
          autoFocus
        />
        {nameError && <div style={S.fieldError}>Give the card a name before saving.</div>}
      </Field>
      <Field label="Issuer">
        <input style={S.input} value={issuer} onChange={(e) => setIssuer(e.target.value)} placeholder="e.g. American Express" />
      </Field>
      <Field label="Annual fee">
        <input style={S.input} type="number" value={annualFee} onChange={(e) => setAnnualFee(e.target.value)} placeholder="e.g. 695" />
      </Field>
      <Field label="Color">
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", maxWidth: 280 }}>
          {PALETTE.map((c) => (
            <button
              key={c}
              type="button"
              onClick={() => setColor(c)}
              style={{ width: 26, height: 26, borderRadius: 6, background: c, border: color === c ? `2px solid ${S.colors.gold}` : "2px solid transparent", cursor: "pointer" }}
            />
          ))}
        </div>
      </Field>
      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 20 }}>
        <button type="button" className="lg-btn-ghost" style={S.btnGhost} onClick={onClose}>Cancel</button>
        <button type="button" className="lg-btn-primary" style={S.btnPrimary} onClick={handleSave}>
          Save card
        </button>
      </div>
    </Modal>
  );
}

function BenefitModal({ benefit, cards, defaultCardId, onSave, onClose }) {
  const [name, setName] = useState(benefit?.name || "");
  const [vendor, setVendor] = useState(benefit?.vendor || "");
  const [value, setValue] = useState(benefit?.value ?? "");
  const [periodicity, setPeriodicity] = useState(benefit?.periodicity || "monthly");
  const [trackingMode, setTrackingMode] = useState(benefit?.trackingMode || "single");
  const [targetCount, setTargetCount] = useState(benefit?.targetCount ?? "");
  const [resetMonth, setResetMonth] = useState(benefit?.resetMonth ?? "");
  const [resetDay, setResetDay] = useState(benefit?.resetDay ?? "");
  const [notes, setNotes] = useState(benefit?.notes || "");
  const [cardId, setCardId] = useState(benefit?.cardId || defaultCardId || cards[0]?.id);
  const [category, setCategory] = useState(benefit?.category || "");
  const [nameError, setNameError] = useState(false);
  const [categoryError, setCategoryError] = useState(false);

  if (cards.length === 0) {
    return (
      <Modal onClose={onClose} title="Add benefit">
        <div style={{ color: S.colors.muted, fontSize: 14, marginBottom: 18 }}>
          Add a card first — every benefit needs to belong to one.
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end" }}>
          <button type="button" className="lg-btn-ghost" style={S.btnGhost} onClick={onClose}>Close</button>
        </div>
      </Modal>
    );
  }

  const handleSave = () => {
    let hasError = false;
    if (name.trim().length === 0) {
      setNameError(true);
      hasError = true;
    }
    if (!category) {
      setCategoryError(true);
      hasError = true;
    }
    if (hasError) return;
    const effectivePeriodicity = trackingMode === "offer" ? "monthly" : periodicity;
    const useCustomReset = effectivePeriodicity === "annual" && resetMonth && resetDay;
    onSave({
      id: benefit?.id || uid(),
      cardId,
      name: name.trim(),
      vendor: vendor.trim(),
      category,
      value: trackingMode === "offer" ? 0 : Number(value) || 0,
      periodicity: effectivePeriodicity,
      trackingMode,
      targetCount: trackingMode === "counter" ? Number(targetCount) || undefined : undefined,
      resetMonth: useCustomReset ? Number(resetMonth) : undefined,
      resetDay: useCustomReset ? Number(resetDay) : undefined,
      notes: notes.trim(),
    });
  };

  const modeHint = TRACKING_MODES.find((m) => m.id === trackingMode)?.hint;

  return (
    <Modal onClose={onClose} title={benefit ? "Edit benefit" : "Add benefit"}>
      <Field label="Card">
        <select style={S.input} value={cardId} onChange={(e) => setCardId(e.target.value)}>
          {cards.map((c) => (
            <option key={c.id} value={c.id}>{c.name}</option>
          ))}
        </select>
      </Field>
      <Field label="Benefit name">
        <input
          style={{ ...S.input, borderColor: nameError ? S.colors.rose : S.colors.border }}
          value={name}
          onChange={(e) => { setName(e.target.value); if (nameError) setNameError(false); }}
          placeholder="e.g. Uber Cash"
          autoFocus
        />
        {nameError && <div style={S.fieldError}>Give the benefit a name before saving.</div>}
      </Field>
      <Field label="Category">
        <select
          style={{ ...S.input, borderColor: categoryError ? S.colors.rose : S.colors.border }}
          value={category}
          onChange={(e) => { setCategory(e.target.value); if (categoryError) setCategoryError(false); }}
        >
          <option value="" disabled>Choose a category…</option>
          {CATEGORIES.map((c) => (
            <option key={c.id} value={c.id}>{c.label}</option>
          ))}
        </select>
        {categoryError && <div style={S.fieldError}>Pick a category before saving.</div>}
      </Field>
      <Field label="Vendor (optional)">
        <input style={S.input} value={vendor} onChange={(e) => setVendor(e.target.value)} placeholder="e.g. Uber, Resy, DoorDash" />
      </Field>
      <Field label="Tracking">
        <select style={S.input} value={trackingMode} onChange={(e) => setTrackingMode(e.target.value)}>
          {TRACKING_MODES.map((m) => (
            <option key={m.id} value={m.id}>{m.label}</option>
          ))}
        </select>
        {modeHint && <div style={{ fontSize: 12, color: S.colors.muted, marginTop: 6, lineHeight: 1.4 }}>{modeHint}</div>}
      </Field>
      {trackingMode === "offer" ? (
        <div style={{ fontSize: 12, color: S.colors.muted, marginBottom: 14, lineHeight: 1.4 }}>
          No dollar cap and no set periodicity to configure — this always resets monthly, and you'll log each amount as you earn it.
        </div>
      ) : (
        <>
          <div style={{ display: "flex", gap: 12 }}>
            <div style={{ flex: 1 }}>
              <Field label="Value ($)">
                <input style={S.input} type="number" value={value} onChange={(e) => setValue(e.target.value)} placeholder="e.g. 15" />
              </Field>
            </div>
            <div style={{ flex: 1 }}>
              <Field label="Resets">
                <select style={S.input} value={periodicity} onChange={(e) => setPeriodicity(e.target.value)}>
                  {PERIODICITY.map((p) => (
                    <option key={p.id} value={p.id}>{p.label}</option>
                  ))}
                </select>
              </Field>
            </div>
          </div>
          {periodicity === "annual" && (
            <Field label="Reset date (optional)">
              <div style={{ display: "flex", gap: 12 }}>
                <select style={S.input} value={resetMonth} onChange={(e) => setResetMonth(e.target.value)}>
                  <option value="">Month</option>
                  {MONTH_NAMES.map((m, i) => (
                    <option key={m} value={i + 1}>{m}</option>
                  ))}
                </select>
                <input style={S.input} type="number" min="1" max="31" value={resetDay} onChange={(e) => setResetDay(e.target.value)} placeholder="Day" />
              </div>
              <div style={{ fontSize: 12, color: S.colors.muted, marginTop: 6, lineHeight: 1.4 }}>
                Leave blank for a calendar-year credit (Jan 1–Dec 31). Set this for credits tied to your account anniversary, like Chase's $300 travel credit.
              </div>
            </Field>
          )}
        </>
      )}
      {trackingMode === "counter" && (
        <Field label="Included uses (optional)">
          <input style={S.input} type="number" value={targetCount} onChange={(e) => setTargetCount(e.target.value)} placeholder="e.g. 4" />
        </Field>
      )}
      <Field label="Notes (optional)">
        <textarea style={{ ...S.input, minHeight: 60, resize: "vertical" }} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="How to redeem, restrictions, etc." />
      </Field>
      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 20 }}>
        <button type="button" className="lg-btn-ghost" style={S.btnGhost} onClick={onClose}>Cancel</button>
        <button type="button" className="lg-btn-primary" style={S.btnPrimary} onClick={handleSave}>
          Save benefit
        </button>
      </div>
    </Modal>
  );
}

function Field({ label, children }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 12, color: S.colors.muted, marginBottom: 6, fontFamily: S.fonts.mono }}>{label}</div>
      {children}
    </div>
  );
}

function Icon({ children, size = 16, color, strokeWidth = 2, style, onClick, ...rest }) {
  return (
    <svg
      width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color || "currentColor"} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      style={style} onClick={onClick} {...rest}
    >
      {children}
    </svg>
  );
}

function ChevronDown(p) { return <Icon {...p}><polyline points="6 9 12 15 18 9" /></Icon>; }

function Trash2(p) { return <Icon {...p}><path d="M3 6h18" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></Icon>; }
function GripVertical(p) {

/* ---------------- Auth + instance-code gate ---------------- */
const AUTH_S = {
  wrap: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: colors.bg, padding: 24 },
  card: { width: 380, maxWidth: "100%", background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 14, padding: 32, textAlign: "center" },
  title: { fontFamily: fonts.serif, fontSize: 26, color: colors.text, marginBottom: 8 },
  sub: { fontSize: 13.5, color: colors.muted, lineHeight: 1.5, marginBottom: 24 },
  googleBtn: { display: "flex", alignItems: "center", justifyContent: "center", gap: 10, width: "100%", background: colors.text, color: "#181410", border: "none", borderRadius: 8, padding: "11px 16px", fontSize: 14, fontWeight: 500, cursor: "pointer", fontFamily: fonts.sans },
  divider: { height: 1, background: colors.border, margin: "22px 0" },
  choiceRow: { display: "flex", flexDirection: "column", gap: 10 },
  input: { width: "100%", background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: 7, padding: "10px 12px", color: colors.text, fontSize: 15, fontFamily: fonts.mono, textAlign: "center", letterSpacing: "0.04em", boxSizing: "border-box", textTransform: "uppercase" },
  error: { fontSize: 12.5, color: colors.roseText, marginTop: 10 },
  signedInAs: { fontSize: 12, color: colors.muted, marginBottom: 18, fontFamily: fonts.mono },
};

function AuthGate() {
  const [authChecked, setAuthChecked] = useState(false);
  const [user, setUser] = useState(null);
  const [ledgerCode, setLedgerCode] = useState(null);
  const [resolvingCode, setResolvingCode] = useState(false);
  const [mode, setMode] = useState("choose"); // "choose" | "join"
  const [joinDraft, setJoinDraft] = useState("");
  const [justCreatedCode, setJustCreatedCode] = useState(null);
  const [copyFeedback, setCopyFeedback] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    return auth.onAuthStateChanged((u) => {
      setUser(u);
      setAuthChecked(true);
      setError(null);
      if (u) {
        const cached = loadLocalCode(u.uid);
        if (cached) {
          setResolvingCode(true);
          db.collection(LEDGERS_COLLECTION).doc(cached).get().then((snap) => {
            if (snap.exists) {
              setLedgerCode(cached);
            } else {
              forgetLocalCode(u.uid);
              setLedgerCode(null);
            }
            setResolvingCode(false);
          }).catch(() => setResolvingCode(false));
        } else {
          setLedgerCode(null);
        }
      } else {
        setLedgerCode(null);
      }
    });
  }, []);

  // Popups are unreliable in mobile Safari and standalone (home-screen) PWA
  // mode — there's no reliable way for the page to regain control after one.
  // Redirect leaves the page and comes back here; onAuthStateChanged above
  // picks up the signed-in user once Firebase processes the return trip.
  // getRedirectResult only exists here to surface an error if that failed.
  useEffect(() => {
    auth.getRedirectResult().catch((e) => {
      if (e?.code && e.code !== "auth/no-auth-event") setError("Couldn't sign in — try again.");
    });
  }, []);

  const signIn = () => {
    setError(null);
    auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
    // no .then/.catch/.finally — the page navigates away immediately
  };

  const signOut = () => {
    forgetLocalCode(user?.uid);
    setLedgerCode(null);
    auth.signOut();
  };

  const switchLedger = () => {
    forgetLocalCode(user?.uid);
    setLedgerCode(null);
    setMode("choose");
    setJoinDraft("");
  };

  const startNew = () => {
    setBusy(true);
    setError(null);
    const code = genLedgerCode();
    db.collection(LEDGERS_COLLECTION).doc(code).set({ ...buildDefaultSeed(), createdAt: new Date().toISOString() })
      .then(() => {
        saveLocalCode(user.uid, code);
        setJustCreatedCode(code);
      })
      .catch(() => setError("Couldn't start a new ledger — try again."))
      .finally(() => setBusy(false));
  };

  const copyJustCreatedCode = () => {
    navigator.clipboard?.writeText(justCreatedCode).then(() => {
      setCopyFeedback(true);
      setTimeout(() => setCopyFeedback(false), 1500);
    });
  };

  const joinExisting = () => {
    const code = joinDraft.trim().toUpperCase();
    if (!code) return;
    setBusy(true);
    setError(null);
    db.collection(LEDGERS_COLLECTION).doc(code).get()
      .then((snap) => {
        if (!snap.exists) {
          setError("No ledger found with that code — double check it and try again.");
          return;
        }
        saveLocalCode(user.uid, code);
        setLedgerCode(code);
      })
      .catch(() => setError("Couldn't check that code — try again."))
      .finally(() => setBusy(false));
  };

  if (!authChecked || resolvingCode) {
    return (
      <div style={AUTH_S.wrap}>
        <span style={{ color: colors.muted, fontFamily: fonts.mono, fontSize: 13 }}>Loading…</span>
      </div>
    );
  }

  if (!user) {
    return (
      <div style={AUTH_S.wrap}>
        <div style={AUTH_S.card}>
          <div style={AUTH_S.title}>Purrkfection</div>
          <div style={AUTH_S.sub}>Sign in with Google to open a shared benefits ledger.</div>
          <button type="button" style={AUTH_S.googleBtn} onClick={signIn}>
            Sign in with Google
          </button>
          {error && <div style={AUTH_S.error}>{error}</div>}
        </div>
      </div>
    );
  }

  if (justCreatedCode) {
    return (
      <div style={AUTH_S.wrap}>
        <div style={AUTH_S.card}>
          <div style={AUTH_S.title}>Ledger created!</div>
          <div style={AUTH_S.sub}>Share this code with anyone else who should see it — they'll sign in with Google and enter it to join.</div>
          <div style={{ ...S.codeMenuCode, fontSize: 24, textAlign: "center", marginBottom: 0 }} onClick={copyJustCreatedCode} title="Click to copy">
            {justCreatedCode}
          </div>
          <div style={{ fontSize: 12, color: colors.muted, textAlign: "center", marginTop: 6 }}>
            {copyFeedback ? "✓ copied" : "Tap to copy"}
          </div>
          <button
            type="button"
            className="lg-btn-primary"
            style={{ ...S.btnPrimary, width: "100%", marginTop: 18 }}
            onClick={() => { setLedgerCode(justCreatedCode); setJustCreatedCode(null); }}
          >
            Continue to ledger
          </button>
        </div>
      </div>
    );
  }

  if (!ledgerCode) {
    return (
      <div style={AUTH_S.wrap}>
        <div style={AUTH_S.card}>
          <div style={AUTH_S.signedInAs}>Signed in as {user.email}</div>
          <div style={AUTH_S.title}>Open a ledger</div>
          {mode === "choose" ? (
            <>
              <div style={AUTH_S.sub}>Start a brand-new shared ledger, or join one someone already started by entering its code.</div>
              <div style={AUTH_S.choiceRow}>
                <button type="button" className="lg-btn-primary" style={S.btnPrimary} onClick={startNew} disabled={busy}>
                  Start a new ledger
                </button>
                <button type="button" className="lg-btn-ghost" style={S.btnGhost} onClick={() => setMode("join")} disabled={busy}>
                  Join with a code
                </button>
              </div>
            </>
          ) : (
            <>
              <div style={AUTH_S.sub}>Enter the code whoever started this ledger shared with you.</div>
              <input
                style={AUTH_S.input}
                value={joinDraft}
                onChange={(e) => setJoinDraft(e.target.value)}
                placeholder="e.g. PERK-7X2"
                autoFocus
                onKeyDown={(e) => { if (e.key === "Enter") joinExisting(); }}
              />
              <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                <button type="button" className="lg-btn-ghost" style={{ ...S.btnGhost, flex: 1 }} onClick={() => { setMode("choose"); setError(null); }} disabled={busy}>Back</button>
                <button type="button" className="lg-btn-primary" style={{ ...S.btnPrimary, flex: 1 }} onClick={joinExisting} disabled={busy}>Join</button>
              </div>
            </>
          )}
          {error && <div style={AUTH_S.error}>{error}</div>}
          <div style={{ ...AUTH_S.divider }} />
          <button type="button" className="lg-btn-ghost" style={{ ...S.btnGhost, width: "100%" }} onClick={signOut}>Sign out</button>
        </div>
      </div>
    );
  }

  const instanceRef = db.collection(LEDGERS_COLLECTION).doc(ledgerCode);
  return (
    <BenefitsLedger
      instanceRef={instanceRef}
      ledgerCode={ledgerCode}
      userLabel={user.displayName || user.email}
      onSignOut={signOut}
      onSwitchLedger={switchLedger}
    />
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AuthGate />);
</script>
